services:
  starrocks:
    image: starrocks/allin1-ubuntu:4.1.6
    container_name: starrocks
    ports:
      - "8080:8080"   # FE HTTP (allin1 default)
      - "9030:9030"   # FE MySQL protocol (Metabase connects here)
    volumes:
      # FE metadata and BE storage persist the internal measurements DB (lookup MV)
      - fe_meta:/data/deploy/starrocks/fe/meta
      - be_storage:/data/deploy/starrocks/be/storage
      # Image defaults with smaller memory settings (the image's FE heap is 8 GB)
      - ./fe.conf:/data/deploy/starrocks/fe/conf/fe.conf:ro
      - ./be.conf:/data/deploy/starrocks/be/conf/be.conf:ro
    mem_limit: 3g
    healthcheck:
      # allin1 image runs FE HTTP on 8080 by default
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -P 9030 -u root --connect-timeout=3 -e 'SELECT 1' > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  starrocks-init:
    image: mysql:8.0
    container_name: starrocks-init
    depends_on:
      starrocks:
        condition: service_healthy
    volumes:
      - ./init:/init
    environment:
      - POLARIS_URI=${POLARIS_URI}
      - POLARIS_WAREHOUSE=${POLARIS_WAREHOUSE}
      - POLARIS_CLIENT_CREDENTIAL=${POLARIS_CLIENT_CREDENTIAL}
      - POLARIS_SCOPE=${POLARIS_SCOPE}
      - AWS_REGION=${AWS_REGION}
    entrypoint: ["/bin/bash", "/init/init-catalog.sh"]
    restart: "no"

  metabase:
    build:
      context: .
      dockerfile: Dockerfile.metabase
    platform: linux/arm64
    container_name: metabase
    ports:
      - "3000:3000"
    environment:
      - JAVA_OPTS=-Xmx1500m
      - MB_DB_TYPE=h2
      # Own H2 file per engine; the pre-vending DB stays at /metabase-data/metabase.db
      - MB_DB_FILE=/metabase-data/metabase-starrocks.db
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      starrocks:
        condition: service_healthy
      starrocks-init:
        condition: service_completed_successfully
    mem_limit: 2g

  grafana:
    image: grafana/grafana:13.2.3
    container_name: grafana
    ports:
      - "3001:3000"   # 3000 is Metabase
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/measurements.json
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      starrocks:
        condition: service_healthy
    mem_limit: 768m

volumes:
  fe_meta:
  be_storage:
  grafana_data:
  metabase_data:
    name: metabase_data   # shared name so Metabase data persists when switching engines
