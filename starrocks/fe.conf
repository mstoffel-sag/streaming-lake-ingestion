# StarRocks FE configuration
# Tuned for a 6 GB Docker host

LOG_DIR = /opt/starrocks/fe/log

# JVM heap for the FE process (query planning, metadata)
JAVA_OPTS_FOR_JDK_17 = "-Dlog4j2.formatMsgNoLookups=true -Xmx800m -Xms256m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
JAVA_OPTS_FOR_JDK_11 = "-Dlog4j2.formatMsgNoLookups=true -Xmx800m -Xms256m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"

http_port = 8030
rpc_port = 9020
query_port = 9030
edit_log_port = 9010
