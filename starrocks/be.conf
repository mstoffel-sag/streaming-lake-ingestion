# StarRocks BE configuration
# Tuned for a 6 GB Docker host

sys_log_dir = /opt/starrocks/be/log
be_port = 9060
be_http_port = 8040
heartbeat_service_port = 9050
brpc_port = 8060

# BE memory cap — leave headroom for FE (800 MB) and Metabase (1.5 GB)
mem_limit = 1500MB

storage_root_path = /opt/starrocks/be/storage
