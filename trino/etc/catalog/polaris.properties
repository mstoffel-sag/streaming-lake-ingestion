connector.name=iceberg
iceberg.catalog.type=rest

# Polaris REST catalog endpoint — values injected via ${ENV:...} from container environment
iceberg.rest-catalog.uri=${ENV:POLARIS_URI}
iceberg.rest-catalog.warehouse=${ENV:POLARIS_WAREHOUSE}

# OAuth2 client-credentials flow (CLIENT_ID:CLIENT_SECRET from .env)
# Token endpoint is derived automatically: {iceberg.rest-catalog.uri}/v1/oauth/tokens
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=${ENV:POLARIS_CLIENT_CREDENTIAL}
iceberg.rest-catalog.oauth2.scope=${ENV:POLARIS_SCOPE}

# Disable credential vending — Trino will use the static S3 keys below
iceberg.rest-catalog.vended-credentials-enabled=false

# Static S3 credentials (no credential vending from Polaris)
fs.native-s3.enabled=true
s3.aws-access-key=${ENV:AWS_ACCESS_KEY}
s3.aws-secret-key=${ENV:AWS_SECRET_KEY}
s3.region=${ENV:AWS_REGION}
